[workspace]
name = "klink"
version = "0.1.0"
description = "Multi-Model Python/Mojo Song Analysis Tool"
readme = "docs/README.md"
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["win-64", "linux-64", "osx-arm64"] # Mainly WSL2 & Linux

[dependencies]
python = ">=3.11"
pytorch = ">=2.2"
librosa = ">=0.10"
pandas = ">=2.2"
numpy = ">=2.1.3"
scikit-learn = ">=1.4"
streamlit = ">=1.47.1"
jupyter = ">=1.0.0"
ipykernel = ">=6.0.0"
matplotlib = ">=0.10"
tqdm = ">=0.10"

[target.linux-64.dependencies]
max = "*"

[target.osx-arm64.dependencies]
max = "*"

[tasks]
train = "python src/train.py"
bench-pytorch = "python src/infer_pytorch.py"
bench-max = "mojo src/infer_max.mojo"
